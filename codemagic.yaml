workflows:
  ios-release:
    name: FloraSonics iOS Release v2
    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: FloraSonics Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.florasonics.wellness
      vars:
        BUNDLE_ID: "com.florasonics.wellness"
        APP_STORE_APPLE_ID: "6761284963"
        FASTLANE_USER: Donnalockett@ymail.com
        FASTLANE_PASSWORD: Lanaejr1908@%
        FASTLANE_MATCH_REPO: https://github.com/Donna6609/certificates
      node: 22.14.0
      xcode: 16.2
      cocoapods: 1.15.2

    scripts:
      - name: Setup Fastlane and Match
        script: |
          sudo gem install fastlane -NV
          mkdir -p ~/.fastlane

      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Install Capacitor
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npm install @capawesome-team/capacitor-in-app-purchases

      - name: Generate app icon
        script: |
          npm install --save-dev @capacitor/assets
          npx capacitor-assets generate --ios
        working_directory: .

      - name: Add iOS platform, sync and install pods
        script: |
          set -e
          npx cap add ios
          npx cap sync ios
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install --repo-update
          else
            echo "No Podfile found - using Swift Package Manager, skipping pod install"
          fi

      - name: Fix bundle identifier in Xcode
        script: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.florasonics.wellness;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Create App Store Connect API Key file
        script: |
          echo "$APPSTORE_API_KEY_JSON" > $HOME/appstore_api_key.json

      - name: Generate Signing Assets with Fastlane Match
        script: |
          cd ios/App
          fastlane match appstore \
            --api_key_path $HOME/appstore_api_key.json \
            --app_identifier $BUNDLE_ID \
            --type distribution \
            --readonly false \
            --force_for_new_devices \
            --skip_confirmation

      - name: Set build number
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $((BUILD_NUMBER + 1))
        working_directory: ios/App

      - name: Build iOS
        script: |
          set -e
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --config "Release" \
            --disable-xcpretty

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: FloraSonics Android Release
    max_build_duration: 90
    instance_type: linux_x2

    environment:
      android_signing:
        - florasonics
      vars:
        PACKAGE_NAME: "com.florasonics.wellness"
      node: 22.0.0
      java: 17

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Install Capacitor
        script: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Generate app icon
        script: |
          npm install --save-dev @capacitor/assets
          npx capacitor-assets generate --android
        working_directory: .

      - name: Add Android platform and sync
        script: |
          set -e
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch Android Java 17 (post-sync)
        script: |
          find android -name '*.gradle' -o -name '*.gradle.kts' | xargs grep -l '21' 2>/dev/null | while read f; do
            echo "Patching $f"
            sed -i 's/JavaVersion\.VERSION_21/JavaVersion.VERSION_17/g' "$f"
            sed -i 's/jvmTarget = "21"/jvmTarget = "17"/g' "$f"
            sed -i "s/jvmTarget '21'/jvmTarget '17'/g" "$f"
            sed -i 's/sourceCompatibility JavaVersion\.VERSION_21/sourceCompatibility JavaVersion.VERSION_17/g' "$f"
            sed -i 's/targetCompatibility JavaVersion\.VERSION_21/targetCompatibility JavaVersion.VERSION_17/g' "$f"
            sed -i "s/sourceCompatibility = 21/sourceCompatibility = 17/g" "$f"
            sed -i "s/targetCompatibility = 21/targetCompatibility = 17/g" "$f"
          done
          echo "Post-sync patch complete"

      - name: Force Java 17 on all subprojects
        script: |
          cat >> android/build.gradle << 'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android.compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
                  tasks.withType(JavaCompile).configureEach {
                      options.release = 17
                  }
              }
          }
          EOF
          echo "Injected Java 17 override into android/build.gradle"

      - name: Configure Gradle properties
        script: |
          cat >> android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.parallel=false
          EOF
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle || true
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle || true

      - name: Verify Keystore
        script: |
          echo "Keystore path: $CM_KEYSTORE_PATH"
          ls -la $CM_KEYSTORE_PATH

      - name: Sign and Build Android
        script: |
          cd android
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          echo "=== Built APK files ==="
          find app/build -name '*.apk' 2>/dev/null || echo "No APK found!"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - Donnalockett@ymail.com
        notify:
          success: true
          failure: true